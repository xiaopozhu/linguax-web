name = "linguax-web"
main = "worker/index.js"
compatibility_date = "2024-12-20"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./build"
binding = "ASSETS"
run_worker_first = true

# 所有请求先经过 Worker，统一域名和历史路径后再读取 ASSETS。

# 自定义域名配置
[[routes]]
pattern = "linguax.app/*"
zone_name = "linguax.app"

[[routes]]
pattern = "www.linguax.app/*"
zone_name = "linguax.app"

[env.production]
[[env.production.routes]]
pattern = "linguax.app/*"
zone_name = "linguax.app"

[[env.production.routes]]
pattern = "www.linguax.app/*"
zone_name = "linguax.app"
